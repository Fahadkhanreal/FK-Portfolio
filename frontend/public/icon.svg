<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16161A"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C7BFF"/>
      <stop offset="50%" stop-color="rgba(140, 123, 255, 0.2)"/>
      <stop offset="100%" stop-color="#63E6BE"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECE9E2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Inner Subtle Grid/Glow -->
  <circle cx="32" cy="32" r="22" fill="#8C7BFF" fill-opacity="0.08"/>

  <!-- FK Monogram Typography -->
  <text x="30" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">FK</text>

  <!-- Active Status Cybernetic Neon Pulse Dot -->
  <circle cx="48" cy="16" r="4" fill="#63E6BE" filter="url(#glow)"/>
  <circle cx="48" cy="16" r="2" fill="#FFFFFF"/>
</svg>
